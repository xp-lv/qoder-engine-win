app_name: morse-inverse-scattering

# ═══════════════════════════════════════════════════════════════
# 设计约定（架构级注释块，供审阅者审查与运行引擎参照）
# ═══════════════════════════════════════════════════════════════
#
# 版本: v3 — 纯理论研究模式（Morse 理论降阶逆散射理论可行性论证）
# 设计目标: 以纯理论推导（定理+证明）论证 Morse 理论降阶逆散射方法
#           的理论可行性——用介电常数分布的拓扑临界点代替全域逐点
#           求解，大幅减少逆问题未知数，使不适定问题恢复适定性。
#           不依赖仿真软件，产出纯理论文档。
#
# §1  编排总览（四段 × 角色映射）
#     S1 入口段    → 理论问题定义者(producer) → （校验）→ 临界点分析者
#     S2 对抗段    → 临界点分析者 → 拓扑红队 → 适定性审查者
#                    （拓扑红队/适定性审查者 challenged 回退临界点分析者，max: 5）
#                    ── 以上全部为串行区，无并行兄弟分支，backward 边无时序竞争 ──
#     S3 并行段    → 适定性审查者(confirmed) → [文献调研者, 理论推导者, 工程可行性验证者]
#                    （FORK 扇出，三路并行理论研究）
#     S4 汇入终态  → [文献调研者, 理论推导者, 工程可行性验证者] → 研究报告者 → 完成
#
# §2  循环回路与 max_executions
#     a) 拓扑对抗回路    —— 拓扑红队 challenged → 临界点分析者   max: 5
#     b) 适定性回路      —— 适定性审查者 challenged → 临界点分析者  max: 5
#     两条 backward 边均位于 S1-S2 串行区内（FORK 尚未启动），回到临界点分析者，
#     形成以临界点拓扑分析为核心的迭代优化环。无并行兄弟分支，无时序竞争（CF-1 合规）。
#     max_executions 耗尽后，verdict_enum 动态过滤强制收敛（框架内置）。
#     注意：两条 backward 边的 max_executions 各自独立计数（非共享额度），
#     理论最恶劣场景下临界点分析者最多可被重新执行 10 次（拓扑回路 5 + 适定性回路 5 叠加）。
#
# §3  并行拓扑（v3 — 纯理论研究模式）
#     [FORK] 适定性审查者 confirmed → 文献调研者 + 理论推导者 + 工程可行性验证者
#     [JOIN] 文献调研者 + 理论推导者 + 工程可行性验证者 → 研究报告者
#     Fork/Join 构成对称并行：文献综述线 + 理论推导线 + 工程可行性线
#     FORK 位于适定性审查通过之后（串行对抗回路完成），backward 边不进入并行区。
#
# §4  对抗性设计（双层对抗审查）
#     第一层：拓扑红队 —— 检验临界点选取是否遗漏拓扑特征（鞍点误判为噪声等）
#         confirmed → 适定性审查者；challenged → 临界点分析者（回退迭代）
#     第二层：适定性审查者 —— 检查降阶后反问题是否仍严重欠定
#         confirmed → [FORK] 三路并行；challenged → 临界点分析者（回退迭代）
#     两层审查串行排列：先验拓扑正确性，再验数学适定性。
#
# §5  回退上下文注入（编译器自动行为）
#     backward 边回退时，编译器自动将源角色产出物 + gate 结果 + 用户反馈 + 目标自身产出注入。
#     受影响的产出物：
#       · 拓扑对抗报告 → 临界点分析者（拓扑红队 challenged 时注入）
#       · 适定性审查报告 → 临界点分析者（适定性审查者 challenged 时注入）
#     两条 backward 边均在串行区触发（FORK 未启动），无兄弟分支状态歧义。
#
# §6  知识文档注入（5 份知识文档，选择性注入）
#     Morse理论方法         → 临界点分析者, 拓扑红队, 适定性审查者, 理论推导者
#     逆散射物理原理        → 理论问题定义者, 理论推导者
#     Morse理论文献综述     → 文献调研者
#     逆散射适定性理论      → 理论推导者, 适定性审查者
#     工程可行性分析框架    → 工程可行性验证者
#
# §7  核心创新点（Morse 降阶逆散射理论可行性论证）
#     传统方法：500 个 B 样条控制点 vs ~48 个独立约束 → 严重欠定
#     Morse 方法：~20-50 个临界点参数 vs ~48 个独立约束 → 接近适定
#     理论推导者以纯数学推导论证降阶反问题的适定性（定理+证明），
#     工程可行性验证者以理论估算论证计算复杂度与数值稳定性改善。
# ═══════════════════════════════════════════════════════════════

knowledge:
  - Morse理论方法: knowledge/Morse理论方法.md
    inject_to: [临界点分析者, 拓扑红队, 适定性审查者, 理论推导者]
  - 逆散射物理原理: knowledge/逆散射物理原理.md
    inject_to: [理论问题定义者, 理论推导者]
  - Morse理论文献综述: knowledge/Morse理论文献综述.md
    inject_to: [文献调研者]
  - 逆散射适定性理论: knowledge/逆散射适定性理论.md
    inject_to: [理论推导者, 适定性审查者]
  - 工程可行性分析框架: knowledge/工程可行性分析框架.md
    inject_to: [工程可行性验证者]

roles:
  # ═══ S1 入口段：理论问题定义 → 临界点分析 ═══

  # producer 入口角色，confirm: manual
  # 定义研究范围、核心命题、理论假设与待证明的关键定理
  # 产出全局唯一理论研究纲领，所有下游角色据此执行
  理论问题定义者:
    type: producer
    confirm: manual
    outputs:
      - 理论研究纲领: 00-理论研究纲领.md

  # 从理论 ε_r 场模型出发，理论分析临界点拓扑结构
  # 这是核心创新的理论基础——临界点参数化将 500 未知数降至 ~20-50
  # confirmed → 拓扑红队审查
  # 回退来源：拓扑红队/适定性审查者 challenged
  临界点分析者:
    type: standard
    confirm: auto
    inputs:
      - 理论研究纲领: 00-理论研究纲领.md
    outputs:
      - 临界点分析报告: outputs/临界点分析报告.md, type=process

  # ═══ S2 对抗段：拓扑红队 + 适定性审查者 ═══

  # 第一层对抗：检验临界点选取是否遗漏拓扑特征
  # 审验内容：鞍点误判为噪声、Morse 指标 Euler 示性数校验、Morse-Smale 复形连接合理性
  # confirmed → 适定性审查者；challenged → 临界点分析者（回退迭代, max: 5）
  拓扑红队:
    type: standard
    confirm: auto
    inputs:
      - 临界点分析报告: outputs/临界点分析报告.md, type=process
    outputs:
      - 拓扑对抗报告: outputs/拓扑红队-对抗分析报告.md, type=process

  # 第二层对抗：检查降阶后反问题是否仍严重欠定
  # 审验内容：临界点参数数 vs 独立约束数、Morse 不等式收敛下界有效性
  # confirmed → [FORK] 三路并行（文献调研/理论推导/工程可行性）；challenged → 临界点分析者（回退迭代, max: 5）
  适定性审查者:
    type: standard
    confirm: auto
    inputs:
      - 临界点分析报告: outputs/临界点分析报告.md, type=process
      - 拓扑对抗报告: outputs/拓扑红队-对抗分析报告.md, type=process
    outputs:
      - 适定性审查报告: outputs/适定性审查报告.md, type=process

  # ═══ S3 并行段：文献/理论/工程三路并行 ═══

  # 文献综述线：系统性梳理 Morse 理论在逆散射与 TDA 领域的已有工作
  # confirmed → [JOIN] 研究报告者
  文献调研者:
    type: standard
    confirm: auto
    inputs:
      - 理论研究纲领: 00-理论研究纲领.md
      - 适定性审查报告: outputs/适定性审查报告.md, type=process
    outputs:
      - 文献综述报告: outputs/文献综述报告.md, type=process

  # 理论推导线：降阶反演数学框架推导与适定性证明
  # 以纯数学推导（定理+证明）替代数值反演
  # confirmed → [JOIN] 研究报告者
  理论推导者:
    type: standard
    confirm: auto
    inputs:
      - 临界点分析报告: outputs/临界点分析报告.md, type=process
      - 适定性审查报告: outputs/适定性审查报告.md, type=process
    outputs:
      - 理论推导报告: outputs/理论推导报告.md, type=process

  # 工程可行性线：理论方法的工程实现可行性分析（不做仿真，只做理论估算）
  # confirmed → [JOIN] 研究报告者
  工程可行性验证者:
    type: standard
    confirm: auto
    inputs:
      - 理论研究纲领: 00-理论研究纲领.md
      - 适定性审查报告: outputs/适定性审查报告.md, type=process
    outputs:
      - 工程可行性分析报告: outputs/工程可行性分析报告.md, type=process

  # ═══ S4 汇入终态：研究报告 → 完成 ═══

  # 汇总三路理论研究成果，产出纯理论研究报告
  # confirmed → 完成
  研究报告者:
    type: standard
    confirm: auto
    inputs:
      - 文献综述报告: outputs/文献综述报告.md, type=process
      - 理论推导报告: outputs/理论推导报告.md, type=process
      - 工程可行性分析报告: outputs/工程可行性分析报告.md, type=process
    outputs:
      - 研究报告: 研究报告.md

edges:
  # ═══════════════════════════════════════════════════════════════
  # S1 入口段：理论问题定义 → 临界点分析
  # ═══════════════════════════════════════════════════════════════

  # producer 自动展开：理论问题定义者 → 理论问题定义者（校验）
  - 理论问题定义者 → 理论问题定义者（校验）
  # 校验通过 → 临界点分析（fail 边由编译器自动生成回退到理论问题定义者）
  - 理论问题定义者（校验）→ 临界点分析者 when: result.verdict == "confirmed"

  # ═══════════════════════════════════════════════════════════════
  # S2 对抗段（全部串行，在 FORK 之前 —— CF-1 合规核心）
  # ═══════════════════════════════════════════════════════════════

  # 临界点分析 confirmed → 拓扑红队审查
  - 临界点分析者 → 拓扑红队 when: result.verdict == "confirmed"

  # ── 第一层对抗：拓扑红队（串行区内，backward 无并行兄弟分支） ──
  # confirmed → 适定性审查者（拓扑特征审查通过）
  - 拓扑红队 → 适定性审查者 when: result.verdict == "confirmed"
  # challenged → 临界点分析者（回退迭代，临界点选取有异议）
  - 拓扑红队 → 临界点分析者 when: result.verdict == "challenged" max_executions: 5

  # ── 第二层对抗：适定性审查者（串行区内，backward 无并行兄弟分支） ──
  # confirmed → [FORK] 三路并行（适定性通过后扇出）
  - 适定性审查者 → [文献调研者, 理论推导者, 工程可行性验证者] when: result.verdict == "confirmed"
  # challenged → 临界点分析者（回退迭代，适定性仍有问题）
  - 适定性审查者 → 临界点分析者 when: result.verdict == "challenged" max_executions: 5

  # ═══════════════════════════════════════════════════════════════
  # S3+S4 汇入终态：[JOIN] 同步汇入 → 研究报告 → 完成
  # ═══════════════════════════════════════════════════════════════

  # [JOIN] 文献调研者 + 理论推导者 + 工程可行性验证者 → 研究报告者（barrier 同步）
  - [文献调研者, 理论推导者, 工程可行性验证者] → 研究报告者

  # 研究报告 → 完成（终态出口）
  - 研究报告者 → 完成 when: result.verdict == "confirmed"
